
name: Build and Push TreeLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name treelabregistry2026gwc

      - name: Build Docker image
        run: |
          docker build -t treelabregistry2026gwc.azurecr.io/treelab:staging .

      - name: Push Docker image
        run: |
          docker push treelabregistry2026gwc.azurecr.io/treelab:staging
