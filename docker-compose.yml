services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: treelab
      POSTGRES_USER: treelab
      POSTGRES_PASSWORD: treelab
    ports:
      - "5432:5432"
    volumes:
      - treelab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treelab -d treelab"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://treelab:treelab@postgres:5432/treelab
      SESSION_SECRET: local-development-only-change-me
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port 3000"
volumes:
  treelab-postgres:
